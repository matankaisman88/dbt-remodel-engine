[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbt-remodel-engine"
version = "0.1.0"
description = "Headless dbt remodeling engine with layer synthesis, refactor rules, and model-level parity verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0",
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["remodel_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
